<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Party Planner — PocketSmart</title><link rel="stylesheet" href="/static/css/style.css"></head><body><div id="appNav"></div><main class="planner-page"><section class="page-hero"><span class="eyebrow">EVENT PLANNING</span><h1>Party Budget Planner</h1><p>Plan your perfect event with smart budget allocations.</p></section><form id="partyForm" class="form-card"><div class="form-section"><h2>💰 Basic Information</h2><div class="two-col"><label>Total Budget (₹)<input type="number" name="budget" min="1" step="1" placeholder="90000" required></label><label>Number of Guests<input type="number" name="guests" min="1" step="1" placeholder="50" required></label></div></div><div class="form-section"><h2>🎉 Event Details</h2><div class="two-col"><label>Party Type<select name="event_type"><option>Birthday</option><option>Wedding</option><option>Anniversary</option><option>Corporate</option><option>House Party</option></select></label><label>Venue Type<select name="venue"><option>Home</option><option>Restaurant</option><option>Hall</option><option>Outdoor</option><option>Any</option></select></label></div></div><div class="form-section"><h2>🎵 Additional Requirements</h2><label>Preferences<textarea name="preferences" placeholder="Theme, dietary needs, music, decoration preferences…"></textarea></label></div><button class="btn btn-primary full" type="submit">✦ Generate Budget Plan</button><div id="result" class="result"></div></form></main><script src="/static/js/app.js"></script></body></html>
