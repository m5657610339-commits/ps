<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Home Interior Planner — PocketSmart</title><link rel="stylesheet" href="/static/css/style.css"></head><body><div id="appNav"></div><main class="planner-page"><section class="page-hero"><span class="eyebrow">HOME INTERIOR</span><h1>Home Interior Budget Planner</h1><p>Create a customized budget plan for your dream space.</p></section><form id="homeForm" class="form-card"><div class="form-section"><h2>💰 Budget Details</h2><label>Total Budget (₹)<input type="number" name="budget" min="1" step="1" placeholder="50000" required></label></div><div class="form-section"><h2>🏠 Space & Style</h2><div class="two-col"><label>Room<select name="room"><option>Living Room</option><option>Bedroom</option><option>Kitchen</option><option>Home Office</option><option>Dining Room</option></select></label><label>Style<select name="style"><option>Modern</option><option>Minimalist</option><option>Traditional</option><option>Luxury</option><option>Scandinavian</option></select></label></div></div><div class="form-section"><h2>🛋️ What do you need?</h2><label>Items / preferences<textarea name="items" placeholder="e.g. sofa, ceiling lights, warm colors, storage…"></textarea></label></div><button class="btn btn-primary full" type="submit">✦ Generate Budget Plan</button><div id="result" class="result"></div></form></main><script src="/static/js/app.js"></script></body></html>
