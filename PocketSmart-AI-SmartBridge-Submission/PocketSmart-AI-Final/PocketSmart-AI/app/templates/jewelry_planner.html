<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jewelry Planner — PocketSmart</title><link rel="stylesheet" href="/static/css/style.css"></head><body><div id="appNav"></div><main class="planner-page"><section class="page-hero"><span class="eyebrow">STYLE & SHOPPING</span><h1>Jewelry Budget Planner</h1><p>Get AI-powered jewelry recommendations within your budget.</p></section><form id="jewelryForm" class="form-card"><div class="form-section"><h2>💰 Budget Details</h2><label>Total Budget (₹)<input type="number" name="budget" min="1" step="1" placeholder="10000" required></label></div><div class="form-section"><h2>💎 Occasion & Preferences</h2><div class="two-col"><label>Occasion<input name="occasion" placeholder="Birthday, wedding, party…" required></label><label>Style<select name="style"><option>Elegant</option><option>Casual</option><option>Minimalist</option><option>Traditional</option><option>Statement</option></select></label></div><label>Outfit description<textarea name="outfit_description" placeholder="Describe your outfit, colors or materials…"></textarea></label></div><div class="form-section"><h2>📷 Upload Outfit Image <span class="optional">optional</span></h2><input class="file-input" name="outfit_image" type="file" accept="image/*"></div><button class="btn btn-primary full" type="submit">✦ Get Recommendations</button><div id="result" class="result"></div></form></main><script src="/static/js/app.js"></script></body></html>
